<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smartLIB - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: #000;
            color: white;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .logo span { color: #00d2ff; }

        .search-bar {
            flex: 0.5;
            display: flex;
            background: white;
            border-radius: 20px;
            padding: 5px 15px;
        }

        .search-bar input {
            border: none;
            outline: none;
            width: 100%;
            padding: 5px;
            font-size: 0.9rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 60px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 50px 40px;
            width: 420px;
            text-align: center;
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
        }

        .login-card h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* Tab switcher */
        .tab-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            padding: 0;
            font-weight: 600;
            transition: 0.2s;
        }
        .tab-btn.active {
            color: #00d2ff;
            border-bottom: 2px solid #00d2ff;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.4);
        }

        .input-group input {
            width: 100%;
            padding: 10px 40px 10px 5px;
            background: none;
            border: none;
            outline: none;
            color: white;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
        }

        .input-group input::placeholder { color: rgba(255,255,255,0.5); }

        .input-group i {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.8;
        }

        .options {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .options a { color: white; text-decoration: none; }

        .login-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: #111d2b;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .login-btn:hover {
            background: #1a2e44;
            transform: scale(1.02);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.9rem;
        }

        .footer-text a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        #statusMsg {
            margin-bottom: 15px;
            font-size: 0.85rem;
            min-height: 20px;
            color: #ff6b6b;
        }
        #statusMsg.success { color: #00d2ff; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Smart<span>LIB</span></div>
        <div class="search-bar">
            <input type="text" placeholder="Search books, authors, topics...">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="ai_reader.html">AI Reader</a></li>
                <li><a href="dictionary.html">Dictionary</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="login-card">
            <i class="fa-solid fa-xmark close-btn" onclick="window.location='index.html'"></i>
            <h2 id="cardTitle">Login</h2>

            <!-- Tab switcher -->
            <div class="tab-row">
                <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" id="registerTab" onclick="switchTab('register')">Register</button>
            </div>

            <div id="statusMsg"></div>
            
            <!-- Login Form -->
            <div id="loginForm">
                <div class="input-group">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="options">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button class="login-btn" id="loginBtn" onclick="handleLogin()">Login</button>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display:none;">
                <div class="input-group">
                    <input type="text" id="regName" placeholder="Full Name" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-group">
                    <input type="email" id="regEmail" placeholder="Email" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-group">
                    <input type="password" id="regPassword" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button class="login-btn" id="registerBtn" onclick="handleRegister()">Create Account</button>
            </div>

            <p class="footer-text" id="switchText">
                Don't have an account? <a onclick="switchTab('register')">Register</a>
            </p>
        </div>
    </div>

<script>
    const API_BASE = "https://library-backend-1m1a.onrender.com";

    // ── If already logged in, redirect to dashboard ──
    const existing = JSON.parse(localStorage.getItem("smartlib_user") || "null");
    if (existing) window.location.href = "dashboard.html";

    function switchTab(tab) {
        const isLogin = tab === 'login';
        document.getElementById('loginForm').style.display    = isLogin ? 'block' : 'none';
        document.getElementById('registerForm').style.display = isLogin ? 'none'  : 'block';
        document.getElementById('loginTab').classList.toggle('active', isLogin);
        document.getElementById('registerTab').classList.toggle('active', !isLogin);
        document.getElementById('cardTitle').innerText = isLogin ? 'Login' : 'Register';
        document.getElementById('switchText').innerHTML = isLogin
            ? `Don't have an account? <a onclick="switchTab('register')">Register</a>`
            : `Already have an account? <a onclick="switchTab('login')">Login</a>`;
        setStatus('', false);
    }

    function setStatus(msg, isSuccess = false) {
        const el = document.getElementById('statusMsg');
        el.innerText = msg;
        el.className = isSuccess ? 'success' : '';
    }

    function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.innerText = loading ? 'Please wait...' : (btnId === 'loginBtn' ? 'Login' : 'Create Account');
    }

    async function handleLogin() {
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!email || !password) { setStatus('Please fill in all fields.'); return; }

        setLoading('loginBtn', true);
        setStatus('');

        try {
            // GET all users and match credentials client-side
            // (backend has no /auth/login — uses GET /users)
            const users = await fetch(`${API_BASE}/users`).then(r => r.json());
            const match = users.find(u => u.email === email && u.password === password);

            if (!match) {
                setStatus('Invalid email or password.');
            } else {
                localStorage.setItem("smartlib_user", JSON.stringify(match));
                setStatus('Login successful! Redirecting...', true);
                setTimeout(() => window.location.href = 'dashboard.html', 800);
            }
        } catch (err) {
            setStatus('Server error. Please try again.');
            console.error(err);
        } finally {
            setLoading('loginBtn', false);
        }
    }

    async function handleRegister() {
        const name     = document.getElementById('regName').value.trim();
        const email    = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        if (!name || !email || !password) { setStatus('Please fill in all fields.'); return; }

        setLoading('registerBtn', true);
        setStatus('');

        try {
            const res = await fetch(`${API_BASE}/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            if (!res.ok) throw new Error('Registration failed');
            const newUser = await res.json();
            localStorage.setItem("smartlib_user", JSON.stringify(newUser));
            setStatus('Account created! Redirecting...', true);
            setTimeout(() => window.location.href = 'dashboard.html', 800);
        } catch (err) {
            setStatus('Registration failed. Try again.');
            console.error(err);
        } finally {
            setLoading('registerBtn', false);
        }
    }

    // Enter key support
    document.addEventListener('keypress', e => {
        if (e.key === 'Enter') {
            const isLogin = document.getElementById('loginForm').style.display !== 'none';
            isLogin ? handleLogin() : handleRegister();
        }
    });
</script>

</body>
</html>
